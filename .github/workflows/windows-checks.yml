name: Windows checks

on:
  push:
    branches: [main, 'ci/windows-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and unsigned installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate workflow
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'actionlint'
          Invoke-WebRequest 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip' -OutFile $archive
          $expected = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'actionlint archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $destination
          & (Join-Path $destination 'actionlint.exe') .github/workflows/windows-checks.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Prepare logs and Rust toolchain
        run: |
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install locked frontend dependencies
        run: |
          pnpm install --frozen-lockfile 2>&1 | Tee-Object ci-logs/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend tests
        run: |
          pnpm exec vitest run --reporter=verbose --reporter=junit --outputFile.junit=ci-logs/frontend-junit.xml 2>&1 | Tee-Object ci-logs/frontend-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend type check and build
        run: |
          pnpm build 2>&1 | Tee-Object ci-logs/frontend-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust format check
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check 2>&1 | Tee-Object ci-logs/rust-format.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | Tee-Object ci-logs/rust-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust Clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | Tee-Object ci-logs/rust-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned NSIS installer
        run: |
          pnpm tauri build --bundles nsis --no-sign --ci -- --locked 2>&1 | Tee-Object ci-logs/nsis-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing after successful build' }
          $installers | Get-FileHash -Algorithm SHA256 | Format-List | Out-File ci-logs/installer-sha256.txt

      - name: Preserve test and build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-check-logs
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-unsigned-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
