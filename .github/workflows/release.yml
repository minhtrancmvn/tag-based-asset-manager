name: Release

# After Windows checks pass for a push to main, bump the version from commit
# types since the last tag, build unsigned macOS and Windows packages from the
# bumped tree, commit the bump to main and publish a prerelease.
on:
  workflow_run:
    workflows: [Windows checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test release version script
        run: node --test 'scripts/*.test.mjs'

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main_sha" != "$TESTED_SHA" ]; then
            echo "::notice::main moved to $main_sha after $TESTED_SHA was tested; the newer run releases it."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-version.mjs next | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUNDLES: ${{ matrix.bundles }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Apply release version
        run: |
          node scripts/release-version.mjs apply "$VERSION"
          git add -u
          mkdir -p release/assets
          git write-tree > release/source-tree.txt

      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned bundles
        run: pnpm tauri build --bundles "$BUNDLES" --no-sign --ci -- --locked

      - name: Collect macOS packages
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bundle=src-tauri/target/release/bundle
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name "*_${VERSION}_aarch64.dmg" -print -quit)
          if [ -z "$app" ] || [ -z "$dmg" ]; then
            echo "::error::Missing .app or ${VERSION} aarch64 DMG"
            exit 1
          fi
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [ "$bundle_version" != "$VERSION" ]; then
            echo "::error::App bundle version $bundle_version, expected $VERSION"
            exit 1
          fi
          archs=$(lipo -archs "$app/Contents/MacOS/"*)
          if [ "$archs" != "arm64" ]; then
            echo "::error::Expected arm64 executable, found $archs"
            exit 1
          fi
          name="Tag-Based-Asset-Manager_${VERSION}"
          ditto -c -k --keepParent "$app" "release/assets/${name}_arm64.app.zip"
          cp "$dmg" "release/assets/${name}_aarch64.dmg"
          hdiutil verify "release/assets/${name}_aarch64.dmg"
          if [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "::error::TAURI_UPDATER_PUBLIC_KEY is configured but TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is missing"
              exit 1
            fi
            tar_gz="release/assets/${name}_aarch64.app.tar.gz"
            tar -czf "$tar_gz" -C "$bundle/macos" "$(basename "$app")"
            pnpm tauri signer sign --app-version "$VERSION" "$tar_gz"
            if [ ! -f "${tar_gz}.sig" ]; then
              echo "::error::Missing macOS updater signature ${tar_gz}.sig"
              exit 1
            fi
          fi

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*_"${VERSION}"_x64-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one ${VERSION} x64 NSIS installer, found ${#installers[@]}"
            exit 1
          fi
          installer="release/assets/Tag-Based-Asset-Manager_${VERSION}_x64-setup.exe"
          cp "${installers[0]}" "$installer"
          if [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "::error::TAURI_UPDATER_PUBLIC_KEY is configured but TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is missing"
              exit 1
            fi
            pnpm tauri signer sign --app-version "$VERSION" "$installer"
            if [ ! -f "${installer}.sig" ]; then
              echo "::error::Missing Windows installer signature ${installer}.sig"
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ runner.os }}
          path: |
            release/assets/
            release/source-tree.txt
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish v${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts

      - name: Verify build sources and commit version
        id: commit
        run: |
          node scripts/release-version.mjs apply "$VERSION"
          git add -u
          tree=$(git write-tree)
          shopt -s nullglob
          trees=(artifacts/*/source-tree.txt)
          if [ "${#trees[@]}" -ne 2 ]; then
            echo "::error::Expected source trees from 2 builds, found ${#trees[@]}"
            exit 1
          fi
          for file in "${trees[@]}"; do
            if [ "$(tr -d '\r\n' < "$file")" != "$tree" ]; then
              echo "::error::$file was built from a different tree than release tree $tree"
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            target=$TESTED_SHA
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m "chore(release): v$VERSION"
            target=$(git rev-parse HEAD)
            # Fast-forward only: fails rather than overwriting a newer main.
            git push origin "$target:refs/heads/main"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Verify release packages and signatures
        run: |
          mkdir release
          cp artifacts/*/assets/* release/
          count=$(find release -maxdepth 1 -type f | wc -l)
          if [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            if [ "$count" -ne 6 ]; then
              echo "::error::Expected 6 release files with updater enabled (3 packages, 1 updater tarball, 2 signatures), found $count"
              ls -l release
              exit 1
            fi
            node scripts/update-feed.mjs verify \
              --version "$VERSION" \
              --artifacts-dir release \
              --public-key "$TAURI_UPDATER_PUBLIC_KEY"
          else
            if [ "$count" -ne 3 ]; then
              echo "::error::Expected 3 packages, found $count"
              ls -l release
              exit 1
            fi
          fi
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish prerelease
        env:
          TARGET: ${{ steps.commit.outputs.target }}
        run: |
          TAG="v$VERSION"
          notes="Automated unsigned prerelease built from \`$TARGET\` after Windows checks passed on \`$TESTED_SHA\`.

          macOS packages (Apple Silicon) have no Developer ID signing or notarization, and the Windows x64 installer is unsigned; platform warnings may block installation. Verify downloads against \`SHA256SUMS.txt\`.

          [Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy) · [MIT License](https://github.com/$GITHUB_REPOSITORY/blob/$TARGET/LICENSE)"
          gh release create "$TAG" release/* \
            --target "$TARGET" \
            --title "$TAG — unsigned preview builds" \
            --notes "$notes" \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_TAG" \
            --prerelease \
            --latest=false

      - name: Publish update preview feed
        if: env.TAURI_UPDATER_PUBLIC_KEY != ''
        run: |
          TAG="v$VERSION"
          body=$(gh release view "$TAG" --json body -q .body)
          node scripts/update-feed.mjs generate \
            --version "$VERSION" \
            --artifacts-dir release \
            --public-key "$TAURI_UPDATER_PUBLIC_KEY" \
            --notes "$body" \
            --repository "$GITHUB_REPOSITORY" \
            --out latest.json

          feed_dir=$(mktemp -d)
          git clone --depth 1 --branch update-preview "https://github.com/${GITHUB_REPOSITORY}.git" "$feed_dir" 2>/dev/null || {
            git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$feed_dir"
            git -C "$feed_dir" checkout --orphan update-preview
            git -C "$feed_dir" rm -rf . || true
          }
          cp latest.json "$feed_dir/latest.json"
          git -C "$feed_dir" add latest.json
          if ! git -C "$feed_dir" diff --cached --quiet; then
            git -C "$feed_dir" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m "chore(update): publish $TAG manifest"
            git -C "$feed_dir" -c credential.helper= \
                -c credential.helper='!gh auth git-credential' push origin update-preview
          fi
          rm -rf "$feed_dir"
